services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: chargewise-db
    environment:
      POSTGRES_DB: ${DB_NAME:-chargewise}
      POSTGRES_USER: ${DB_USER:-chargewise}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-chargewise}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-chargewise} -d ${DB_NAME:-chargewise}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: chargewise-rag:latest
    container_name: chargewise-app
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-chargewise}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
